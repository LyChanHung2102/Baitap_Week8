<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows Calculator - Máy tính Windows</title>
  <style>
    :root {
      --bg-color: #202020;
      --calc-bg: #2b2b2b;
      --display-bg: transparent;
      --btn-num-bg: #3b3b3b;
      --btn-num-hover: #323232;
      --btn-num-active: #282828;
      --btn-op-bg: #323232;
      --btn-op-hover: #3b3b3b;
      --btn-op-active: #292929;
      --btn-equal-bg: #4cc2ff;
      --btn-equal-hover: #47b2ea;
      --btn-equal-active: #3da1d6;
      --btn-equal-text: #000000;
      --text-main: #ffffff;
      --text-sub: #a0a0a0;
      --text-disabled: #555555;
      --border-btn: rgba(255, 255, 255, 0.05);
      --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #181818;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-family);
      color: var(--text-main);
      padding: 20px;
    }

    /* Calculator Window Frame */
    .calculator-app {
      width: 360px;
      height: 580px;
      background: var(--calc-bg);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Top Title Bar */
    .title-bar {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-sub);
    }

    .title-bar .left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .mode-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Display Area */
    .display-container {
      padding: 8px 18px 4px 18px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      height: 110px;
    }

    .secondary-display {
      font-size: 13px;
      color: var(--text-sub);
      min-height: 20px;
      word-break: break-all;
      text-align: right;
    }

    .main-display {
      font-size: 42px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.1;
      width: 100%;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: font-size 0.1s;
    }

    /* Memory Bar */
    .memory-bar {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      padding: 2px 8px;
      gap: 2px;
      margin-bottom: 2px;
    }

    .mem-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .mem-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
    }

    .mem-btn:disabled {
      color: var(--text-disabled);
      cursor: default;
    }

    /* Keypad Grid */
    .keypad {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 3px;
      padding: 4px 6px 6px 6px;
    }

    .btn {
      font-family: var(--font-family);
      font-size: 15px;
      font-weight: 400;
      border: 1px solid var(--border-btn);
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.05s;
      outline: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Number Buttons */
    .btn-num {
      background: var(--btn-num-bg);
      color: var(--text-main);
      font-size: 17px;
      font-weight: 600;
    }

    .btn-num:hover {
      background: var(--btn-num-hover);
    }

    .btn-num:active {
      background: var(--btn-num-active);
    }

    /* Operator Buttons */
    .btn-op {
      background: var(--btn-op-bg);
      color: var(--text-main);
    }

    .btn-op:hover {
      background: var(--btn-op-hover);
    }

    .btn-op:active {
      background: var(--btn-op-active);
    }

    /* Equals Button */
    .btn-equal {
      background: var(--btn-equal-bg);
      color: var(--btn-equal-text);
      font-size: 20px;
      font-weight: 600;
      border: none;
    }

    .btn-equal:hover {
      background: var(--btn-equal-hover);
    }

    .btn-equal:active {
      background: var(--btn-equal-active);
    }

    /* History & Memory Panel (Flyout) */
    .panel-drawer {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(40, 40, 40, 0.98);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      padding: 16px;
      z-index: 10;
      animation: slideDown 0.2s ease-out;
    }

    .panel-drawer.open {
      display: flex;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-item {
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      transition: background 0.15s;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .history-expr {
      font-size: 13px;
      color: var(--text-sub);
    }

    .history-val {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
    }

    .clear-history-btn {
      align-self: flex-end;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 12px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clear-history-btn:hover {
      color: #ff5c5c;
      background: rgba(255, 255, 255, 0.05);
    }

    .empty-state {
      text-align: center;
      color: var(--text-sub);
      font-size: 14px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="calculator-app">
    <!-- Top Bar -->
    <div class="title-bar">
      <div class="left">
        <button class="icon-btn" title="Menu (Standard Mode)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <span class="mode-title">Standard</span>
      </div>
      <button class="icon-btn" id="btn-toggle-history" title="History (Lịch sử)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </button>
    </div>

    <!-- Displays -->
    <div class="display-container">
      <div class="secondary-display" id="sec-display"></div>
      <div class="main-display" id="main-display">0</div>
    </div>

    <!-- Memory Row -->
    <div class="memory-bar">
      <button class="mem-btn" id="mem-mc" disabled>MC</button>
      <button class="mem-btn" id="mem-mr" disabled>MR</button>
      <button class="mem-btn" id="mem-mplus">M+</button>
      <button class="mem-btn" id="mem-mminus">M-</button>
      <button class="mem-btn" id="mem-ms">MS</button>
      <button class="mem-btn" id="mem-view" disabled>M▾</button>
    </div>

    <!-- Keypad Grid -->
    <div class="keypad">
      <!-- Row 1 -->
      <button class="btn btn-op" data-action="percent">%</button>
      <button class="btn btn-op" data-action="clear-entry">CE</button>
      <button class="btn btn-op" data-action="clear">C</button>
      <button class="btn btn-op" data-action="backspace">⌫</button>

      <!-- Row 2 -->
      <button class="btn btn-op" data-action="reciprocal">1/x</button>
      <button class="btn btn-op" data-action="square">x²</button>
      <button class="btn btn-op" data-action="sqrt">²√x</button>
      <button class="btn btn-op" data-action="operator" data-val="/">÷</button>

      <!-- Row 3 -->
      <button class="btn btn-num" data-action="num" data-val="7">7</button>
      <button class="btn btn-num" data-action="num" data-val="8">8</button>
      <button class="btn btn-num" data-action="num" data-val="9">9</button>
      <button class="btn btn-op" data-action="operator" data-val="*">×</button>

      <!-- Row 4 -->
      <button class="btn btn-num" data-action="num" data-val="4">4</button>
      <button class="btn btn-num" data-action="num" data-val="5">5</button>
      <button class="btn btn-num" data-action="num" data-val="6">6</button>
      <button class="btn btn-op" data-action="operator" data-val="-">-</button>

      <!-- Row 5 -->
      <button class="btn btn-num" data-action="num" data-val="1">1</button>
      <button class="btn btn-num" data-action="num" data-val="2">2</button>
      <button class="btn btn-num" data-action="num" data-val="3">3</button>
      <button class="btn btn-op" data-action="operator" data-val="+">+</button>

      <!-- Row 6 -->
      <button class="btn btn-num" data-action="negate">+/-</button>
      <button class="btn btn-num" data-action="num" data-val="0">0</button>
      <button class="btn btn-num" data-action="decimal">.</button>
      <button class="btn btn-equal" data-action="equals">=</button>
    </div>

    <!-- History Panel Drawer -->
    <div class="panel-drawer" id="history-drawer">
      <div class="panel-header">
        <span class="panel-title">History</span>
        <button class="clear-history-btn" id="btn-clear-history">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear
        </button>
      </div>
      <div class="history-list" id="history-items">
        <div class="empty-state">There's no history yet</div>
      </div>
    </div>
  </div>

  <script>
    /**
     * Windows Calculator Clone - Javascript Engine
     */
    class WindowsCalculator {
      constructor() {
        this.currentValue = '0';
        this.previousValue = null;
        this.currentOperator = null;
        this.resetNextInput = false;
        this.lastEqualsOperand = null;
        this.hasError = false;

        // Bộ nhớ và lịch sử
        this.memory = 0;
        this.hasMemory = false;
        this.history = [];

        // DOM Elements
        this.mainDisplay = document.getElementById('main-display');
        this.secDisplay = document.getElementById('sec-display');
        this.btnMC = document.getElementById('mem-mc');
        this.btnMR = document.getElementById('mem-mr');
        this.btnMView = document.getElementById('mem-view');
        this.historyDrawer = document.getElementById('history-drawer');
        this.historyItemsContainer = document.getElementById('history-items');

        this.initEventListeners();
        this.updateDisplay();
      }

      // Khởi tạo các sự kiện phím & click
      initEventListeners() {
        // Xử lý click phím trên keypad
        document.querySelector('.keypad').addEventListener('click', (e) => {
          const btn = e.target.closest('button');
          if (!btn) return;

          const action = btn.dataset.action;
          const val = btn.dataset.val;

          this.handleAction(action, val);
        });

        // Xử lý các nút Memory
        document.getElementById('mem-ms').addEventListener('click', () => this.memoryStore());
        document.getElementById('mem-mr').addEventListener('click', () => this.memoryRecall());
        document.getElementById('mem-mc').addEventListener('click', () => this.memoryClear());
        document.getElementById('mem-mplus').addEventListener('click', () => this.memoryAdd());
        document.getElementById('mem-mminus').addEventListener('click', () => this.memorySubtract());

        // Lịch sử
        document.getElementById('btn-toggle-history').addEventListener('click', () => {
          this.historyDrawer.classList.toggle('open');
        });

        document.getElementById('btn-clear-history').addEventListener('click', () => {
          this.history = [];
          this.renderHistory();
        });

        // Xử lý bàn phím máy tính thực tế
        window.addEventListener('keydown', (e) => this.handleKeyboard(e));
      }

      // Điều hướng hành động
      handleAction(action, val) {
        if (this.hasError && action !== 'clear') {
          return;
        }

        switch (action) {
          case 'num':
            this.inputDigit(val);
            break;
          case 'decimal':
            this.inputDecimal();
            break;
          case 'operator':
            this.setOperator(val);
            break;
          case 'equals':
            this.calculate();
            break;
          case 'clear':
            this.clearAll();
            break;
          case 'clear-entry':
            this.clearEntry();
            break;
          case 'backspace':
            this.backspace();
            break;
          case 'negate':
            this.negate();
            break;
          case 'square':
            this.unaryOperation((x) => x * x, (s) => `sqr(${s})`);
            break;
          case 'sqrt':
            this.unaryOperation((x) => {
              if (x < 0) throw new Error('Invalid input');
              return Math.sqrt(x);
            }, (s) => `√(${s})`);
            break;
          case 'reciprocal':
            this.unaryOperation((x) => {
              if (x === 0) throw new Error('Cannot divide by zero');
              return 1 / x;
            }, (s) => `1/(${s})`);
            break;
          case 'percent':
            this.calculatePercent();
            break;
        }

        this.updateDisplay();
      }

      // Xử lý nhập chữ số
      inputDigit(digit) {
        if (this.resetNextInput) {
          this.currentValue = digit;
          this.resetNextInput = false;
        } else {
          if (this.currentValue === '0') {
            this.currentValue = digit;
          } else {
            // Giới hạn tối đa 16 chữ số như Windows Calculator
            if (this.currentValue.replace(/[^0-9]/g, '').length < 16) {
              this.currentValue += digit;
            }
          }
        }
      }

      // Nhập dấu chấm thập phân
      inputDecimal() {
        if (this.resetNextInput) {
          this.currentValue = '0.';
          this.resetNextInput = false;
          return;
        }
        if (!this.currentValue.includes('.')) {
          this.currentValue += '.';
        }
      }

      // Đổi dấu +/-
      negate() {
        if (this.currentValue === '0') return;
        if (this.currentValue.startsWith('-')) {
          this.currentValue = this.currentValue.substring(1);
        } else {
          this.currentValue = '-' + this.currentValue;
        }
      }

      // Phím Backspace
      backspace() {
        if (this.resetNextInput) return;
        if (this.currentValue.length === 1 || (this.currentValue.length === 2 && this.currentValue.startsWith('-'))) {
          this.currentValue = '0';
        } else {
          this.currentValue = this.currentValue.slice(0, -1);
        }
      }

      // Phép tính hai ngôi (+, -, ×, ÷)
      setOperator(op) {
        const current = parseFloat(this.currentValue);

        if (this.currentOperator && !this.resetNextInput) {
          this.executeBinaryOperation();
        } else {
          this.previousValue = current;
        }

        this.currentOperator = op;
        this.resetNextInput = true;
        this.lastEqualsOperand = null;

        const opSymbol = this.getOperatorSymbol(op);
        this.secDisplay.innerText = `${this.formatNumber(this.previousValue)} ${opSymbol}`;
      }

      // Thực thi phép tính nhị phân hiện tại
      executeBinaryOperation() {
        if (this.previousValue === null || !this.currentOperator) return;

        const prev = this.previousValue;
        const curr = parseFloat(this.currentValue);
        let result = 0;

        try {
          switch (this.currentOperator) {
            case '+':
              result = prev + curr;
              break;
            case '-':
              result = prev - curr;
              break;
            case '*':
              result = prev * curr;
              break;
            case '/':
              if (curr === 0) {
                throw new Error('Cannot divide by zero');
              }
              result = prev / curr;
              break;
          }

          // Khử sai số dấu phẩy động của JS (floating point precision)
          result = this.cleanPrecision(result);
          this.currentValue = String(result);
          this.previousValue = result;
        } catch (err) {
          this.triggerError(err.message);
        }
      }

      // Phím = (Calculate)
      calculate() {
        if (this.hasError) return;

        if (this.currentOperator) {
          const prev = this.previousValue;
          const curr = parseFloat(this.currentValue);
          const op = this.currentOperator;
          const opSymbol = this.getOperatorSymbol(op);

          this.lastEqualsOperand = curr;
          this.executeBinaryOperation();

          if (!this.hasError) {
            const finalResult = this.currentValue;
            const fullExpr = `${this.formatNumber(prev)} ${opSymbol} ${this.formatNumber(curr)} =`;
            this.secDisplay.innerText = fullExpr;

            // Thêm vào History
            this.addHistory(fullExpr, finalResult);

            this.previousValue = null;
            this.currentOperator = null;
            this.resetNextInput = true;
          }
        }
      }

      // Phép tính đơn ngôi (1/x, x², √x)
      unaryOperation(opFunc, exprFormat) {
        try {
          const val = parseFloat(this.currentValue);
          const formattedVal = this.formatNumber(val);
          const result = this.cleanPrecision(opFunc(val));

          this.secDisplay.innerText = exprFormat(formattedVal);
          this.currentValue = String(result);
          this.resetNextInput = true;
        } catch (err) {
          this.triggerError(err.message);
        }
      }

      // Phép tính phần trăm %
      calculatePercent() {
        const curr = parseFloat(this.currentValue);
        if (this.previousValue !== null && this.currentOperator) {
          // Ví dụ: 200 + 10% => 10% của 200 = 20
          const percentVal = (this.previousValue * curr) / 100;
          this.currentValue = String(this.cleanPrecision(percentVal));
        } else {
          // Tính độc lập: x / 100
          this.currentValue = String(this.cleanPrecision(curr / 100));
          this.secDisplay.innerText = `${this.currentValue}`;
        }
        this.resetNextInput = true;
      }

      // Clear Entry (CE)
      clearEntry() {
        this.currentValue = '0';
      }

      // Clear All (C)
      clearAll() {
        this.currentValue = '0';
        this.previousValue = null;
        this.currentOperator = null;
        this.resetNextInput = false;
        this.lastEqualsOperand = null;
        this.hasError = false;
        this.secDisplay.innerText = '';
      }

      // Báo lỗi (Chia cho 0, v.v.)
      triggerError(msg) {
        this.hasError = true;
        this.currentValue = msg;
        this.secDisplay.innerText = '';
      }

      // Memory Operations
      memoryStore() {
        if (this.hasError) return;
        this.memory = parseFloat(this.currentValue);
        this.hasMemory = true;
        this.updateMemoryButtons();
        this.resetNextInput = true;
      }

      memoryRecall() {
        if (!this.hasMemory) return;
        this.currentValue = String(this.memory);
        this.resetNextInput = true;
        this.updateDisplay();
      }

      memoryClear() {
        this.memory = 0;
        this.hasMemory = false;
        this.updateMemoryButtons();
      }

      memoryAdd() {
        if (this.hasError) return;
        this.memory += parseFloat(this.currentValue);
        this.hasMemory = true;
        this.updateMemoryButtons();
        this.resetNextInput = true;
      }

      memorySubtract() {
        if (this.hasError) return;
        this.memory -= parseFloat(this.currentValue);
        this.hasMemory = true;
        this.updateMemoryButtons();
        this.resetNextInput = true;
      }

      updateMemoryButtons() {
        this.btnMC.disabled = !this.hasMemory;
        this.btnMR.disabled = !this.hasMemory;
        this.btnMView.disabled = !this.hasMemory;
      }

      // Quản lý History
      addHistory(expr, result) {
        this.history.unshift({ expr, result });
        if (this.history.length > 30) this.history.pop();
        this.renderHistory();
      }

      renderHistory() {
        if (this.history.length === 0) {
          this.historyItemsContainer.innerHTML = '<div class="empty-state">There\'s no history yet</div>';
          return;
        }

        this.historyItemsContainer.innerHTML = this.history
          .map((item, index) => `
            <div class="history-item" data-index="${index}">
              <div class="history-expr">${item.expr}</div>
              <div class="history-val">${this.formatNumber(item.result)}</div>
            </div>
          `)
          .join('');

        // Cho phép bấm vào mục lịch sử để nạp lại giá trị
        this.historyItemsContainer.querySelectorAll('.history-item').forEach(el => {
          el.addEventListener('click', () => {
            const idx = el.dataset.index;
            this.currentValue = String(this.history[idx].result);
            this.secDisplay.innerText = this.history[idx].expr;
            this.resetNextInput = true;
            this.updateDisplay();
            this.historyDrawer.classList.remove('open');
          });
        });
      }

      // Xử lý độ chính xác số học (tránh 0.1 + 0.2 = 0.30000000000000004)
      cleanPrecision(num) {
        return parseFloat(num.toPrecision(12));
      }

      // Định dạng số hiển thị với dấu phẩy ngăn cách hàng nghìn
      formatNumber(val) {
        if (isNaN(val) || val === Infinity || val === -Infinity) return val;
        const str = String(val);
        const parts = str.split('.');
        const integerPart = parts[0];
        const decimalPart = parts.length > 1 ? '.' + parts[1] : '';

        // Thêm dấu phẩy cho phần nguyên
        const formattedInt = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return formattedInt + decimalPart;
      }

      getOperatorSymbol(op) {
        switch (op) {
          case '+': return '+';
          case '-': return '-';
          case '*': return '×';
          case '/': return '÷';
          default: return '';
        }
      }

      // Cập nhật giao diện chính
      updateDisplay() {
        if (this.hasError) {
          this.mainDisplay.innerText = this.currentValue;
          this.mainDisplay.style.fontSize = '24px';
          return;
        }

        // Tự động thu nhỏ font nếu dãy số dài
        const textLen = this.currentValue.length;
        if (textLen > 14) {
          this.mainDisplay.style.fontSize = '26px';
        } else if (textLen > 10) {
          this.mainDisplay.style.fontSize = '32px';
        } else {
          this.mainDisplay.style.fontSize = '42px';
        }

        this.mainDisplay.innerText = this.formatNumber(this.currentValue);
      }

      // Bắt phím bàn phím vật lý
      handleKeyboard(e) {
        if (e.key >= '0' && e.key <= '9') {
          this.handleAction('num', e.key);
        } else if (e.key === '.' || e.key === ',') {
          this.handleAction('decimal');
        } else if (e.key === '+') {
          this.handleAction('operator', '+');
        } else if (e.key === '-') {
          this.handleAction('operator', '-');
        } else if (e.key === '*' || e.key.toLowerCase() === 'x') {
          this.handleAction('operator', '*');
        } else if (e.key === '/') {
          e.preventDefault();
          this.handleAction('operator', '/');
        } else if (e.key === 'Enter' || e.key === '=') {
          e.preventDefault();
          this.handleAction('equals');
        } else if (e.key === 'Backspace') {
          this.handleAction('backspace');
        } else if (e.key === 'Escape') {
          this.handleAction('clear');
        } else if (e.key === '%') {
          this.handleAction('percent');
        }
      }
    }

    // Khởi chạy Máy tính khi trang load xong
    document.addEventListener('DOMContentLoaded', () => {
      new WindowsCalculator();
    });
  </script>
</body>
</html>
